name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── ts-interpreter をビルド ──────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ts-interpreter/package-lock.json

      - name: Build ts-interpreter
        working-directory: ts-interpreter
        run: |
          npm ci
          npm run build
          mkdir -p ../docs/ts
          cp dist/binop.js ../docs/ts/
          cp ../tutorial.bo ../docs/ts/

      # ── go-compiler-vm を WASM ビルド ────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build go-compiler-vm WASM
        run: cd go-compiler-vm && bash build-wasm.sh

      # ── GitHub Pages にデプロイ ──────────────────────────
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
