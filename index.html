<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinOp Playground</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

  <style>
    .CodeMirror { height: 100%; font-size: 14px; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-gray-900 text-gray-100">

  <header class="flex items-center px-4 py-2 bg-gray-800 border-b border-gray-700 shrink-0">
    <h1 class="text-lg font-bold">BinOp Playground</h1>
    <div class="ml-auto">
      <button id="btn-sample" class="w-7 h-7 rounded bg-gray-700 hover:bg-gray-600 text-sm transition-colors" title="チュートリアルを表示">?</button>
    </div>
  </header>

  <main class="flex flex-col md:flex-row flex-1 min-h-0">
    <!-- 左ペイン: エディタ + ボタン -->
    <div class="flex flex-col flex-1 min-h-0 border-b md:border-b-0 md:border-r border-gray-700">
      <!-- 上: ソースコード -->
      <div class="flex-1 min-h-0 relative">
        <div class="absolute inset-0">
          <textarea id="editor"></textarea>
        </div>
      </div>
      <!-- 下: ボタンリスト -->
      <div class="shrink-0 flex flex-wrap items-center gap-2 px-4 py-2 bg-gray-800 border-t border-gray-700">
        <button id="btn-undo"   class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm transition-colors">Undo</button>
        <button id="btn-redo"   class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm transition-colors">Redo</button>
        <button id="btn-clear"  class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm transition-colors">Clear</button>
        <span class="w-px h-5 bg-gray-600"></span>
        <button id="btn-share"  class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm transition-colors" title="ソースコードをURLに埋め込んでコピー">Share</button>
        <button id="btn-eval"   class="px-4 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm font-semibold transition-colors">Eval ▶</button>
      </div>
    </div>
    <!-- 右ペイン: 実行結果 -->
    <div id="output" class="flex-1 min-h-0 overflow-auto bg-gray-950 font-mono text-sm p-4 text-green-400 whitespace-pre-wrap"></div>
  </main>

  <script src="dist/bundle.js"></script>
  <script>
    // BinOp シンタックスハイライト
    CodeMirror.defineSimpleMode('binop', {
      start: [
        { regex: /"[^"]*"/,                                                    token: 'string' },
        { regex: /\d+/,                                                        token: 'number' },
        { regex: /\b(?:fun|macro|message|evalNode|evalStr|nil|if|print|clone)\b/, token: 'keyword' },
        { regex: /[()]/,                                                       token: 'bracket' },
        { regex: /,/,                                                          token: 'punctuation' },
        { regex: /:=|==|!=|<=|>=|&&|\|\||[+\-*\/%<>=;.]/,                     token: 'operator' },
      ],
    });

    const HELLO = '"Hello, BinOp!".print()';

    const cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'binop',
      theme: 'one-dark',
      lineNumbers: true,
      lineWrapping: true,
    });

    // URL からコード復元、なければ Hello 表示
    const encoded = new URLSearchParams(location.search).get('code');
    cm.setValue(encoded ? (LZString.decompressFromEncodedURIComponent(encoded) ?? HELLO) : HELLO);

    document.getElementById('btn-eval').addEventListener('click', () => {
      const output = document.getElementById('output');
      if (!window.BinOp) {
        output.textContent = 'Error: BinOp interpreter not loaded (npm run build を実行してください)';
        return;
      }
      const compressed = LZString.compressToEncodedURIComponent(cm.getValue());
      history.pushState(null, '', location.pathname + '?code=' + compressed);
      const { logs, error } = window.BinOp.evalCode(cm.getValue());
      output.textContent = error ? 'Error: ' + error : (logs.join('\n') || '(no output)');
    });

    window.addEventListener('popstate', () => {
      const encoded = new URLSearchParams(location.search).get('code');
      cm.setValue(encoded ? (LZString.decompressFromEncodedURIComponent(encoded) ?? '') : '');
    });

    document.getElementById('btn-undo').addEventListener('click', () => history.back());
    document.getElementById('btn-redo').addEventListener('click', () => history.forward());

    document.getElementById('btn-sample').addEventListener('click', () => {
      fetch('tutorial.bo')
        .then(r => r.text())
        .then(text => {
          document.getElementById('output').textContent = text;
        })
        .catch(() => {
          document.getElementById('output').textContent = 'Error: tutorial.bo を読み込めませんでした';
        });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      cm.setValue('');
      document.getElementById('output').textContent = '';
    });

    document.getElementById('btn-share').addEventListener('click', () => {
      const btn = document.getElementById('btn-share');
      const url = location.origin + location.pathname + '?code='
                + LZString.compressToEncodedURIComponent(cm.getValue());
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Share'; }, 2000);
      });
    });
  </script>
</body>
</html>
