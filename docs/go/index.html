<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BinOp Playground – Go Compiler+VM</title>
  <script src="wasm_exec.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e; color: #cdd6f4;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 14px 24px; border-bottom: 1px solid #313244;
      display: flex; align-items: baseline; gap: 14px;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #a6e3a1; }
    header p  { font-size: 0.8rem; color: #6c7086; }
    .header-links { margin-left: auto; display: flex; gap: 14px; }
    header a  { font-size: 0.8rem; color: #89b4fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    main { flex: 1; display: flex; flex-direction: column; padding: 16px 24px; gap: 12px; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 7px 14px; border: none; border-radius: 6px;
      font-size: 0.875rem; cursor: pointer; transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #a6e3a1; color: #1e1e2e; font-weight: 600; }
    .btn-sec     { background: #313244; color: #cdd6f4; }
    .btn-copy-small {
      padding: 2px 8px; font-size: 0.7rem; background: #313244; color: #6c7086;
      border-radius: 4px; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-copy-small:hover { opacity: 0.85; }
    .toolbar-sep { width: 1px; height: 20px; background: #45475a; margin: 0 2px; flex-shrink: 0; }
    .panes {
      display: grid; gap: 12px; flex: 1; min-height: 0;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .panes.il-hidden { grid-template-columns: 1fr 1fr; }
    .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .pane.hidden { display: none; }
    .pane-header { display: flex; align-items: center; gap: 8px; }
    .pane-label {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #6c7086;
    }
    .pane-label span {
      font-size: 0.7rem; font-weight: 400; text-transform: none;
      letter-spacing: 0; color: #45475a; margin-left: 6px;
    }
    textarea {
      flex: 1; background: #181825; color: #cdd6f4; border: 1px solid #313244;
      border-radius: 6px; padding: 12px;
      font-family: "Cascadia Code","Fira Code","JetBrains Mono","Consolas",monospace;
      font-size: 13px; line-height: 1.6; resize: none; outline: none; min-height: 320px;
    }
    textarea:focus { border-color: #585b70; }
    textarea[readonly] { color: #a6adc8; }
    #errorMsg { font-size: 0.8rem; color: #f38ba8; min-height: 1.2em; }
    #status { font-size: 0.8rem; color: #6c7086; }
    /* Share dropdown */
    .share-wrap { position: relative; }
    .share-dropdown {
      display: none; position: absolute; left: 0; top: calc(100% + 6px);
      background: #181825; border: 1px solid #313244; border-radius: 8px;
      overflow: hidden; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      min-width: 180px;
    }
    .share-dropdown p {
      font-size: 0.75rem; color: #6c7086;
      padding: 10px 14px 6px; border-bottom: 1px solid #313244;
    }
    .share-dropdown.open { display: block; }
    .share-dropdown button {
      display: block; width: 100%; text-align: left;
      padding: 9px 14px; background: transparent; color: #cdd6f4;
      border-radius: 0; font-size: 0.85rem;
    }
    .share-dropdown button:hover:not(:disabled) { background: #313244; opacity: 1; }
    .share-dropdown button:disabled { color: #45475a; }
    @media (max-width: 800px) { .panes, .panes.il-hidden { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>BinOp Playground – Go Compiler+VM</h1>
  <p>ソースを IL(中間言語) にコンパイルしてからスタック VM で実行します。</p>
  <div class="header-links">
    <a href="../">← トップへ</a>
    <a href="https://github.com/hoznas/binop-interpriter">リポジトリへ →</a>
  </div>
</header>
<main>
  <div class="toolbar">
    <!-- IL visible only -->
    <button id="btn-compile" class="btn-sec"     disabled>Compile</button>
    <button id="btn-run-il"  class="btn-primary" disabled>Run</button>
    <!-- IL hidden only -->
    <button id="btn-run"     class="btn-primary" disabled style="display:none">Run</button>
    <span id="status"></span>
    <div class="toolbar-sep"></div>
    <!-- Always -->
    <button id="btn-undo"  class="btn-sec">Undo</button>
    <button id="btn-redo"  class="btn-sec">Redo</button>
    <button id="btn-clear" class="btn-sec">Clear</button>
    <button id="btn-help"  class="btn-sec">Help</button>
    <div class="share-wrap">
      <button id="btn-share" class="btn-sec">Share</button>
      <div class="share-dropdown" id="share-dropdown">
        <p>このURLを送ると現在のコードを共有できます</p>
        <button id="btn-share-binop">BinOp</button>
        <button id="btn-share-full">BinOp+IL</button>
      </div>
    </div>
    <div class="toolbar-sep"></div>
    <button id="btn-toggle-il" class="btn-sec">Hide IL</button>
  </div>
  <div class="panes" id="panes">
    <div class="pane">
      <div class="pane-header">
        <div class="pane-label">BinOp Source</div>
        <button class="btn-copy-small" data-target="source">Copy</button>
      </div>
      <textarea id="source" spellcheck="false">factorial := fun(n,
  (n>1).if(n * factorial(n-1), 1))
factorial(5).print()

makeCounter := fun(n:=0; fun(n=n+1))
counter := makeCounter()
counter().print()
counter().print()</textarea>
    </div>
    <div class="pane" id="pane-il">
      <div class="pane-header">
        <div class="pane-label">IL <span>compiler output</span></div>
        <button class="btn-copy-small" data-target="il">Copy</button>
      </div>
      <textarea id="il" spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-header">
        <div class="pane-label">Output</div>
      </div>
      <textarea id="result" readonly spellcheck="false"></textarea>
    </div>
  </div>
  <div id="errorMsg"></div>
</main>
<script>
(async () => {
  const compileBtn = document.getElementById("btn-compile");
  const runILBtn   = document.getElementById("btn-run-il");
  const runBtn     = document.getElementById("btn-run");
  const status     = document.getElementById("status");
  const errorMsg   = document.getElementById("errorMsg");
  const sourceEl   = document.getElementById("source");
  const ilEl       = document.getElementById("il");
  const resultEl   = document.getElementById("result");

  // Restore from URL
  const params = new URLSearchParams(location.search);
  const encCode = params.get("code");
  const encIL   = params.get("il");
  if (encCode) { const d = LZString.decompressFromEncodedURIComponent(encCode); if (d) sourceEl.value = d; }
  if (encIL)   { const d = LZString.decompressFromEncodedURIComponent(encIL);   if (d) ilEl.value = d; }

  status.textContent = "Loading WASM...";
  try {
    const go = new Go();
    const { instance } = await WebAssembly.instantiateStreaming(fetch("binop.wasm"), go.importObject);
    go.run(instance);
    await new Promise(r => setTimeout(r, 0));
    if (typeof binopCompile !== "function" || typeof binopRunIL !== "function") {
      throw new Error("Failed to load functions from WASM");
    }
    status.textContent = "";
    compileBtn.disabled = false;
    runILBtn.disabled   = false;
    runBtn.disabled     = false;
  } catch (e) {
    status.textContent = e.message;
    return;
  }

  function pushHistory() {
    history.pushState(null, "", location.pathname + "?code="
      + LZString.compressToEncodedURIComponent(sourceEl.value));
  }

  compileBtn.addEventListener("click", () => {
    errorMsg.textContent = "";
    try {
      pushHistory();
      ilEl.value = binopCompile(sourceEl.value);
    } catch (e) { errorMsg.textContent = "Error: " + e.message; }
  });

  runILBtn.addEventListener("click", () => {
    errorMsg.textContent = "";
    try {
      resultEl.value = binopRunIL(ilEl.value);
    } catch (e) { errorMsg.textContent = "Error: " + e.message; }
  });

  runBtn.addEventListener("click", () => {
    errorMsg.textContent = "";
    try {
      pushHistory();
      const il = binopCompile(sourceEl.value);
      ilEl.value = il;
      resultEl.value = binopRunIL(il);
    } catch (e) { errorMsg.textContent = "Error: " + e.message; }
  });

  window.addEventListener("popstate", () => {
    const enc = new URLSearchParams(location.search).get("code");
    sourceEl.value = enc ? (LZString.decompressFromEncodedURIComponent(enc) ?? "") : "";
  });

  document.getElementById("btn-undo").addEventListener("click",  () => history.back());
  document.getElementById("btn-redo").addEventListener("click",  () => history.forward());

  document.getElementById("btn-clear").addEventListener("click", () => {
    sourceEl.value = ilEl.value = resultEl.value = "";
    errorMsg.textContent = "";
  });

  document.getElementById("btn-help").addEventListener("click", () => {
    fetch("tutorial-no-macro.bo")
      .then(r => r.text())
      .then(text => { resultEl.value = text; errorMsg.textContent = ""; })
      .catch(() => { errorMsg.textContent = "Error: tutorial-no-macro.bo not found"; });
  });

  // IL pane toggle
  const panesEl   = document.getElementById("panes");
  const paneIL    = document.getElementById("pane-il");
  const toggleBtn = document.getElementById("btn-toggle-il");
  let ilVisible = true;

  function setILVisible(v) {
    ilVisible = v;
    paneIL.classList.toggle("hidden", !ilVisible);
    panesEl.classList.toggle("il-hidden", !ilVisible);
    toggleBtn.textContent = ilVisible ? "Hide IL" : "Show IL";
    compileBtn.style.display = ilVisible ? "" : "none";
    runILBtn.style.display   = ilVisible ? "" : "none";
    runBtn.style.display     = ilVisible ? "none" : "";
  }

  toggleBtn.addEventListener("click", () => setILVisible(!ilVisible));

  // Copy buttons
  document.querySelectorAll(".btn-copy-small").forEach(btn => {
    btn.addEventListener("click", () => {
      const text = document.getElementById(btn.dataset.target).value;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = orig; }, 2000);
      });
    });
  });

  // Share dropdown
  const shareDropdown = document.getElementById("share-dropdown");
  const shareFull     = document.getElementById("btn-share-full");

  document.getElementById("btn-share").addEventListener("click", () => {
    shareFull.disabled = ilEl.value.trim() === "";
    shareDropdown.classList.toggle("open");
  });

  function copyShareURL(url) {
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById("btn-share");
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Share"; }, 2000);
    });
    shareDropdown.classList.remove("open");
  }

  document.getElementById("btn-share-binop").addEventListener("click", () => {
    const url = location.origin + location.pathname + "?code="
      + LZString.compressToEncodedURIComponent(sourceEl.value);
    copyShareURL(url);
  });

  shareFull.addEventListener("click", () => {
    const url = location.origin + location.pathname
      + "?code=" + LZString.compressToEncodedURIComponent(sourceEl.value)
      + "&il="   + LZString.compressToEncodedURIComponent(ilEl.value);
    copyShareURL(url);
  });

  document.addEventListener("click", e => {
    if (!document.getElementById("btn-share").contains(e.target) &&
        !shareDropdown.contains(e.target)) {
      shareDropdown.classList.remove("open");
    }
  });
})();
</script>
</body>
</html>
