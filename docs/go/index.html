<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BinOp Playground – Go Compiler+VM</title>
  <script src="wasm_exec.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e; color: #cdd6f4;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 14px 24px; border-bottom: 1px solid #313244;
      display: flex; align-items: baseline; gap: 14px;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #a6e3a1; }
    header p  { font-size: 0.8rem; color: #6c7086; }
    header a  { margin-left: auto; font-size: 0.8rem; color: #89b4fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    main { flex: 1; display: flex; flex-direction: column; padding: 16px 24px; gap: 12px; }
    .toolbar { display: flex; align-items: center; gap: 10px; }
    button#runBtn {
      padding: 7px 20px; background: #a6e3a1; color: #1e1e2e;
      border: none; border-radius: 6px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    button#runBtn:disabled { opacity: 0.45; cursor: not-allowed; }
    button#runBtn:not(:disabled):hover { opacity: 0.85; }
    #status { font-size: 0.8rem; color: #6c7086; }
    .panes {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 12px; flex: 1; min-height: 0;
    }
    .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .pane-label {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #6c7086;
    }
    .pane-label span {
      font-size: 0.7rem; font-weight: 400; text-transform: none;
      letter-spacing: 0; color: #45475a; margin-left: 6px;
    }
    textarea {
      flex: 1; background: #181825; color: #cdd6f4; border: 1px solid #313244;
      border-radius: 6px; padding: 12px;
      font-family: "Cascadia Code","Fira Code","JetBrains Mono","Consolas",monospace;
      font-size: 13px; line-height: 1.6; resize: none; outline: none; min-height: 320px;
    }
    textarea:focus { border-color: #585b70; }
    textarea[readonly] { color: #a6adc8; }
    #errorMsg { font-size: 0.8rem; color: #f38ba8; min-height: 1.2em; }
    @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>BinOp Playground – Go Compiler+VM</h1>
  <p>ソースを IL にコンパイルしてからスタック VM で実行します。</p>
  <a href="../">← トップへ</a>
</header>
<main>
  <div class="toolbar">
    <button id="runBtn" disabled>読み込み中...</button>
    <span id="status"></span>
  </div>
  <div class="panes">
    <div class="pane">
      <div class="pane-label">BinOp ソース</div>
      <textarea id="source" spellcheck="false">factorial := fun(n,
  (n>1).if(n * factorial(n-1), 1))
factorial(5).print()

makeCounter := fun(n:=0; fun(n=n+1))
counter := makeCounter()
counter().print()
counter().print()</textarea>
    </div>
    <div class="pane">
      <div class="pane-label">中間命令列 <span>IL（コンパイラ出力）</span></div>
      <textarea id="il" readonly spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">実行結果</div>
      <textarea id="result" readonly spellcheck="false"></textarea>
    </div>
  </div>
  <div id="errorMsg"></div>
</main>
<script>
(async () => {
  const runBtn   = document.getElementById("runBtn");
  const status   = document.getElementById("status");
  const errorMsg = document.getElementById("errorMsg");

  status.textContent = "binop.wasm を読み込み中...";
  try {
    const go = new Go();
    const { instance } = await WebAssembly.instantiateStreaming(fetch("binop.wasm"), go.importObject);
    go.run(instance);
    await new Promise(r => setTimeout(r, 0));
    if (typeof binopCompile !== "function" || typeof binopRunIL !== "function") {
      throw new Error("WASM から関数を取得できませんでした");
    }
    status.textContent = "";
    runBtn.textContent = "実行";
    runBtn.disabled = false;
  } catch (e) {
    runBtn.textContent = "読み込み失敗";
    status.textContent = e.message;
    return;
  }

  runBtn.addEventListener("click", () => {
    errorMsg.textContent = "";
    try {
      const il     = binopCompile(document.getElementById("source").value);
      const output = binopRunIL(il);
      document.getElementById("il").value     = il;
      document.getElementById("result").value = output;
    } catch (e) {
      errorMsg.textContent = "エラー: " + e.message;
    }
  });
})();
</script>
</body>
</html>
